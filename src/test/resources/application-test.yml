spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.amqp.autoconfigure.RabbitAutoConfiguration
  datasource:
    url: jdbc:h2:mem:notifytestdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE SCHEMA IF NOT EXISTS notify
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
  mail:
    host: 127.0.0.1
    port: 1025

eventomax:
  notify:
    closure:
      enabled: false
    storage:
      local:
        base-dir: ./target/test-context-storage
    quote:
      output-dir: ./target/test-context-quotes
    catalog:
      enabled: false
