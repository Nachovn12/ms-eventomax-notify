spring:
  application:
    name: ms-eventomax-notify
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:}
    password: ${RABBITMQ_PASSWORD:}
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

server:
  port: 8080

eventomax:
  notify:
    retry:
      max-attempts: ${NOTIFY_RETRY_MAX_ATTEMPTS:3}
      initial-interval-ms: ${NOTIFY_RETRY_INITIAL_INTERVAL_MS:500}
