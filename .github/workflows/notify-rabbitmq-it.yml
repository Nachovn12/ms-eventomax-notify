name: Notify RabbitMQ IT (EP2)

# Manual on GitHub Actions once registered on the default branch.
# One-time bootstrap on develop when this workflow file itself is created/updated.
on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/notify-rabbitmq-it.yml'

permissions:
  contents: read

concurrency:
  group: notify-rabbitmq-it-${{ github.ref }}
  cancel-in-progress: false

jobs:
  isolated-rabbitmq-it:
    name: Email / Crew / Quote - RabbitMQ Testcontainers
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify isolated broker test and no external RabbitMQ configuration
        shell: bash
        run: |
          set -euo pipefail
          test_file='src/test/java/cl/duoc/eventomax/notify/messaging/email/EmailRetryRabbitIT.java'
          test -f "$test_file"
          grep -q '@Testcontainers' "$test_file"
          grep -q 'RABBITMQ_CONTAINER' "$test_file"
          grep -q 'assertIsolatedEphemeralBrokerConnection' "$test_file"
          for key in SPRING_RABBITMQ_ADDRESSES RABBITMQ_HOST RABBITMQ_PORT RABBITMQ_USERNAME RABBITMQ_PASSWORD; do
            if [[ -n "${!key:-}" ]]; then
              echo "::error::External RabbitMQ configuration is not allowed in this CI job ($key)."
              exit 1
            fi
          done
          echo "Isolated Testcontainers prerequisites verified."

      - name: Run real RabbitMQ integration scenarios
        shell: bash
        run: |
          set -euo pipefail
          bash mvnw -B -ntp -Dtest=EmailRetryRabbitIT -DfailIfNoTests=true test

      - name: Summarize integration results
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import os
          import sys
          import xml.etree.ElementTree as ET

          reports = glob.glob("target/surefire-reports/TEST-*EmailRetryRabbitIT.xml")
          if not reports:
              print("No Surefire XML report was generated for EmailRetryRabbitIT.")
              sys.exit(1)

          totals = dict.fromkeys(("tests", "failures", "errors", "skipped"), 0)
          for report in reports:
              root = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0))

          summary = (
              "### RabbitMQ Testcontainers - EP2\n\n"
              f"Tests: **{totals['tests']}** · Failures: **{totals['failures']}** · "
              f"Errors: **{totals['errors']}** · Skipped: **{totals['skipped']}**\n\n"
              "Test class: `EmailRetryRabbitIT` (isolated ephemeral broker).\n"
          )
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write(summary)

          if totals["tests"] < 19 or any(totals[k] for k in ("failures", "errors", "skipped")):
              sys.exit("Unexpected result: at least 19 passing, unskipped scenarios required.")
          PY

      - name: Upload Surefire evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notify-rabbitmq-it-reports
          path: |
            target/surefire-reports/TEST-*EmailRetryRabbitIT.xml
            target/surefire-reports/*EmailRetryRabbitIT.txt
          if-no-files-found: warn
          retention-days: 30
