services:
  ms-eventomax-notify:
    build:
      context: .
    container_name: ms-eventomax-notify
    expose:
      - "8080"
    environment:
      RABBITMQ_HOST: ${RABBITMQ_HOST:?RABBITMQ_HOST is required}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      NOTIFY_RETRY_MAX_ATTEMPTS: ${NOTIFY_RETRY_MAX_ATTEMPTS:-3}
      NOTIFY_RETRY_INITIAL_INTERVAL_MS: ${NOTIFY_RETRY_INITIAL_INTERVAL_MS:-500}
    networks:
      - eventomax-net
    restart: unless-stopped

networks:
  eventomax-net:
    external: true
